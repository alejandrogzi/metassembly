name: integrity

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-integrity:
    name: Pipeline integrity
    runs-on: ubuntu-latest
    env:
      NXF_DISABLE_CHECK_LATEST: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow 25
        uses: nf-core/setup-nextflow@v1
        with:
          version: '25'          # Installs latest 25.x version

      - name: Validate Nextflow config
        run: nextflow config -flat . > /dev/null
